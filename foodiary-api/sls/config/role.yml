statements:
  - Effect: Allow
    Action:
      - dynamodb:PutItem
      - dynamodb:Query
    Resource:
      - Fn::GetAtt:
          - MainTable
          - Arn
      - Fn::Sub: "${MainTable.Arn}/index/*"
  - Effect: Allow
    Action:
      - lambda:AddPermission
      - lambda:RemovePermission
    Resource:
      - Fn::Sub: "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-*"
