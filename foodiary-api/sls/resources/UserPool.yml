Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: ${self:custom.cognito.PoolName}
      DeletionProtection: ACTIVE
      MfaConfiguration: OFF
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      UsernameAttributes:
        - email
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Schema:
        - Name: internalId
          Required: false
          Mutable: false
          AttributeDataType: String
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false
      LambdaConfig:
        PreSignUp: !GetAtt PreSignUpTriggerLambdaFunction.Arn
        PreTokenGenerationConfig:
          LambdaArn: !GetAtt PreTokenGenerationTriggerLambdaFunction.Arn
          LambdaVersion: V2_0

  PreSignUpPermission:
    Type: AWS::Lambda::Permission
    DependsOn: PreSignUpTriggerLambdaFunction
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PreSignUpTriggerLambdaFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  PreTokenGenerationPermission:
    Type: AWS::Lambda::Permission
    DependsOn: PreTokenGenerationTriggerLambdaFunction
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PreTokenGenerationTriggerLambdaFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: ${self:service}-${self:provider.stage}-UserPoolClient
      UserPoolId:
        Ref: UserPool
      GenerateSecret: true
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
      TokenValidityUnits:
        AccessToken: hours
        RefreshToken: days
      RefreshTokenValidity: 30
      AccessTokenValidity: 12

Outputs:
  UserPoolId:
    Value:
      Ref: UserPool
    Export:
      Name: ${self:service}-${self:provider.stage}-UserPoolId
  UserPoolClientId:
    Value:
      Ref: UserPoolClient
    Export:
      Name: ${self:service}-${self:provider.stage}-UserPoolClientId
