signUp:
  handler: src/main/functions/auth/signUp.handler
  environment:
    COGNITO_USER_POOL_ID:
      Ref: UserPool
    COGNITO_CLIENT_ID:
      Ref: UserPoolClient
    COGNITO_CLIENT_SECRET:
      Fn::GetAtt:
        - UserPoolClient
        - ClientSecret
  events:
    - httpApi:
        method: POST
        path: /auth/sign-up

signIn:
  handler: src/main/functions/auth/signIn.handler
  environment:
    COGNITO_USER_POOL_ID:
      Ref: UserPool
    COGNITO_CLIENT_ID:
      Ref: UserPoolClient
    COGNITO_CLIENT_SECRET:
      Fn::GetAtt:
        - UserPoolClient
        - ClientSecret
  events:
    - httpApi:
        method: POST
        path: /auth/sign-in

refreshToken:
  handler: src/main/functions/auth/refreshToken.handler
  events:
    - httpApi:
        method: POST
        path: /auth/refresh-token

forgotPassword:
  handler: src/main/functions/auth/forgotPassword.handler
  events:
    - httpApi:
        method: POST
        path: /auth/forgot-password

preSignUpTrigger:
  handler: src/main/functions/auth/preSignUp.handler
  events: []

# The trigger is configured manually to support event v2
# Go to UserPool.yml for the trigger configuration
preTokenGenerationTrigger:
  handler: src/main/functions/auth/preTokenGenerationTrigger.handler
