# org: httpablo
service: foodiary-api

provider:
  name: aws
  region: sa-east-1
  runtime: nodejs22.x
  memorySize: 128
  stage: ${opt:stage, 'dev'}
  environment:
    COGNITO_CLIENT_ID:
      Ref: UserPoolClient
    COGNITO_CLIENT_SECRET:
      Fn::GetAtt:
        - UserPoolClient
        - ClientSecret
    MAIN_TABLE_NAME:
      Ref: MainTable
  iam:
    role: ${file(./sls/config/role.yml)}

package:
  individually: true

custom:
  cognito:
    PoolName: ${self:service}-${self:provider.stage}-UserPool

build:
  esbuild:
    configFile: ./esbuild.config.mjs

functions: ${file(./sls/functions/auth.yml)}

resources:
  - ${file(./sls/resources/UserPool.yml)}
  - ${file(./sls/resources/MainTable.yml)}
