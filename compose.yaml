services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: foodiary
      POSTGRES_USER: foodiary
      POSTGRES_PASSWORD: foodiary_dev
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - foodiary_postgres_data:/var/lib/postgresql/data
      - ./foodiary-api/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodiary -d foodiary"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  foodiary_postgres_data:
